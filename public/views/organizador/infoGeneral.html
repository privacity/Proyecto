<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TorNet - Información General</title>
    <link rel="stylesheet" href="/css/global.css">
    <style>
        /* Centrar el contenido */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .info-form {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        .btn-tornet {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
        }

        .btn-tornet:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="main-header">
        <div class="logo">TorNet</div>
        <a href="/views/organizador/organizador.html" class="btn-header">Inicio</a>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-container">
        <h1 class="gestion-title">Información General</h1>
        <p class="gestion-subtitle">Edita los datos generales del torneo</p>

        <form id="info-form" class="info-form">
            <div class="form-group">
                <label for="estadoTorneo">Estado del Torneo</label>
                <select id="estadoTorneo" name="estadoTorneo" class="form-control" required>
                    <option value="Planificacion">Planificación</option>
                    <option value="En progreso">En progreso</option>
                    <option value="Finalizado">Finalizado</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fechaInicio">Fecha de Inicio</label>
                <input type="date" id="fechaInicio" name="fechaInicio" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="fechaFin">Fecha de Fin</label>
                <input type="date" id="fechaFin" name="fechaFin" class="form-control" required>
            </div>

            <button type="submit" class="btn-tornet">Guardar</button>
        </form>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>TorNet</p>
        <div class="icons">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idTorneo = urlParams.get('id');

            if (!idTorneo) {
                alert('No se ha seleccionado un torneo para editar.');
                window.location.href = '/views/organizador/editTorneo.html';
                return;
            }

            // Cargar datos del torneo
            fetch(`/api/tournaments/${idTorneo}`)
                .then(res => res.json())
                .then(torneo => {
                    if (!torneo) {
                        alert('El torneo seleccionado no existe.');
                        window.location.href = '/views/organizador/editTorneo.html';
                        return;
                    }

                    // Rellenar el formulario con los datos del torneo
                    document.getElementById('estadoTorneo').value = torneo.estadoTorneo || 'Planificacion';
                    document.getElementById('fechaInicio').value = torneo.fechaInicio ? torneo.fechaInicio.split('T')[0] : '';
                    document.getElementById('fechaFin').value = torneo.fechaFin ? torneo.fechaFin.split('T')[0] : '';
                })
                .catch(err => {
                    console.error('Error al cargar el torneo:', err);
                    alert('Hubo un error al cargar los datos del torneo.');
                    window.location.href = '/views/organizador/editTorneo.html';
                });

            // Guardar cambios
            const form = document.getElementById('info-form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const estadoTorneo = document.getElementById('estadoTorneo').value;
                const fechaInicio = document.getElementById('fechaInicio').value;
                const fechaFin = document.getElementById('fechaFin').value;

                fetch(`/api/tournaments/${idTorneo}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ estadoTorneo, fechaInicio, fechaFin })
                })
                .then(res => {
                    if (res.ok) {
                        alert('Los datos del torneo se han actualizado correctamente.');
                        window.location.href = '/views/organizador/editTorneo.html';
                    } else {
                        alert('Hubo un error al actualizar los datos del torneo.');
                    }
                })
                .catch(err => {
                    console.error('Error al actualizar el torneo:', err);
                    alert('Hubo un error al actualizar los datos del torneo.');
                });
            });
        });
    </script>
</body>
</html>
