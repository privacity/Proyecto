<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TorNet - Editar Torneo</title>
    <link rel="stylesheet" href="/css/global.css">
</head>
<body>
    <!-- HEADER -->
    <header class="main-header">
        <div class="logo">TorNet</div>
        <a href="/views/organizador/organizador.html" class="btn-header">Inicio</a>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-container">
        <h1 class="gestion-title">Editar Torneo</h1>
        <p class="gestion-subtitle">¿Qué deseas hacer?</p>

        <div class="gestion-buttons">
            <button class="gestion-option btn-tornet" data-action="info-general">Información general</button>
            <button class="gestion-option btn-tornet" data-action="equipos">Equipos/Jugadores</button>
            <button class="gestion-option btn-tornet" data-action="programar">Programar partidos</button>
            <button class="gestion-option btn-tornet" data-action="resultados">Registrar resultados</button>
            <button class="gestion-option btn-tornet" data-action="convocatoria">Editar convocatoria</button>
            <button class="gestion-option btn-tornet danger" data-action="cerrar">Cerrar torneo</button>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>TorNet</p>
        <div class="icons">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idTorneo = urlParams.get('id');

            if (!idTorneo) {
                alert('No se ha seleccionado un torneo para editar.');
                window.location.href = '/views/organizador/TorActuales.html';
                return;
            }

            const buttons = document.querySelectorAll('.gestion-option');

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const action = button.getAttribute('data-action');
                    handleAction(action, idTorneo);
                });
            });

            function handleAction(action, idTorneo) {
                switch (action) {
                    case 'info-general':
                        window.location.href = `/views/organizador/infoGeneral.html?id=${idTorneo}`;
                        break;
                    case 'equipos':
                        window.location.href = `/views/organizador/equipos.html?id=${idTorneo}`;
                        break;
                    case 'programar':
                        window.location.href = `/views/organizador/ProgPartido.html?id=${idTorneo}`;
                        break;
                    case 'resultados':
                        window.location.href = `/views/organizador/RegResultados.html?id=${idTorneo}`;
                        break;
                    case 'convocatoria':
                        window.location.href = `/views/organizador/editConvocatoria.html?id=${idTorneo}`;
                        break;
                    case 'cerrar':
                        alert('¿Estás seguro de que deseas cerrar el torneo? Esta acción no se puede deshacer.');
                        break;
                    default:
                        console.error('Acción no reconocida:', action);
                }
            }
        });
    </script>
</body>
</html>
