<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipos - TorNet</title>
    <link rel="stylesheet" href="global.css">
</head>

<body>

    <header class="header">
        <h2 class="header-title">TorNet</h2>
        <div class="header-buttons">
            <a href="editTorneo.html" class="nav-btn">
                <i class="fas fa-arrow-left me-2"></i> Volver
            </a>
        </div>
    </header>

    <main class="admin-container">

        <h1 class="admin-title" style="text-align:center; margin-bottom: 2rem;">
            Equipos
        </h1>

        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Nombre del Equipo</th>
                        <th>Representante</th>
                        <th>Jugadores</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>Cuervos FC</td>
                        <td>Avilés Ángel</td>
                        <td>22/22</td>
                        <td class="estado">Aceptado</td>
                        <td>
                            <a class="btn-editar" href="VerJug.html">Ver jugadores</a   >
                            <button class="btn-editar btn-aceptar" disabled style="opacity:.5; cursor:not-allowed;">
                                Aceptar
                            </button>
                            <button class="btn-eliminar btn-rechazar" disabled style="opacity:.5; cursor:not-allowed;">
                                Rechazar
                            </button>
                        </td>
                    </tr>

                    <!-- Ejemplo pendiente (botones activos) -->
                    <tr>
                        <td>Mazatlan CF</td>
                        <td>Alvarado Cristofer</td>
                        <td>18/22</td>
                        <td class="estado">Pendiente</td>
                        <td>
                            <a class="btn-editar" href="VerJug.html">Ver jugadores</a   >
                            <button class="btn-editar btn-aceptar" style="background:#c8f7c5;">Aceptar</button>
                            <button class="btn-eliminar btn-rechazar">Rechazar</button>
                        </td>
                    </tr>

                    <!-- Puedes repetir el patrón para cada fila -->
                </tbody>
            </table>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-logo">TorNet</p>
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </footer>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".btn-aceptar").forEach(boton => {
            boton.addEventListener("click", function () {
                const fila = this.closest("tr");
                const estadoCelda = fila.querySelector(".estado");
                const btnRechazar = fila.querySelector(".btn-rechazar");

                // Cambiar estado visual
                estadoCelda.textContent = "Aceptado";

                // Desactivar botones
                this.disabled = true;
                btnRechazar.disabled = true;

                this.style.opacity = "0.5";
                btnRechazar.style.opacity = "0.5";
                this.style.cursor = "not-allowed";
                btnRechazar.style.cursor = "not-allowed";
            });
        });

        document.querySelectorAll(".btn-rechazar").forEach(boton => {
            boton.addEventListener("click", function () {
                const fila = this.closest("tr");
                const estadoCelda = fila.querySelector(".estado");
                const btnAceptar = fila.querySelector(".btn-aceptar");

                estadoCelda.textContent = "Rechazado";

                btnAceptar.disabled = true;
                this.disabled = true;

                btnAceptar.style.opacity = "0.5";
                this.style.opacity = "0.5";
                btnAceptar.style.cursor = "not-allowed";
                this.style.cursor = "not-allowed";
            });
        });
    });
    </script>
</body>
</html>
