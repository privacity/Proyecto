<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Datos del Jugador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <!-- Header -->
    <header class="main-header">
        <div class="header-title">
            <i class="fas fa-futbol me-2"></i>TorNet
        </div>
        <div class="header-buttons">
            <a href="index.html" class="nav-btn"><i class="fas fa-home me-1"></i> Inicio</a>
            <a href="VerJug.html" class="nav-btn"><i class="fas fa-users me-1"></i> Jugadores</a>
            <a href="TorActuales.html" class="nav-btn"><i class="fas fa-trophy me-1"></i> Torneos</a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-content">
        <div class="container">
            <div class="player-form-container">
                <div class="form-header">
                    <h1 class="h2 mb-2"><i class="fas fa-user-edit me-2"></i>Modificar datos del jugador</h1>
                    <p class="text-muted">Actualiza la información del jugador en el sistema</p>
                </div>

                <form id="playerForm">
                    <!-- Nombre del jugador -->
                    <div class="form-section">
                        <label for="nombreJugador" class="form-label">Nombre del jugador</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="nombreJugador" placeholder="Nombre completo del jugador" value="Lionel Andrés Messi">
                        </div>
                    </div>

                    <!-- Posición -->
                    <div class="form-section">
                        <label for="posicion" class="form-label">Posición</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                            <select class="form-select" id="posicion">
                                <option value="portero">Portero</option>
                                <option value="defensa">Defensa</option>
                                <option value="centrocampista">Centrocampista</option>
                                <option value="delantero" selected>Delantero</option>
                            </select>
                        </div>
                    </div>

                    <!-- Número de camiseta -->
                    <div class="form-section">
                        <label for="numeroCamiseta" class="form-label">Número de camiseta</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-tshirt"></i></span>
                            <input type="number" class="form-control" id="numeroCamiseta" placeholder="Número de camiseta" value="10" min="1" max="99">
                        </div>
                    </div>

                    <!-- Edad -->
                    <div class="form-section">
                        <label for="edad" class="form-label">Edad</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-birthday-cake"></i></span>
                            <input type="number" class="form-control" id="edad" placeholder="Edad del jugador" value="36" min="16" max="50">
                        </div>
                    </div>

                    <!-- Estado -->
                    <div class="form-section">
                        <label for="estado" class="form-label">Estado</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-check-circle"></i></span>
                            <select class="form-select" id="estado">
                                <option value="aceptar">Aceptar</option>
                                <option value="pendiente" selected>Pendiente</option>
                                <option value="rechazar">Rechazar</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-divider"></div>

                    <!-- Observaciones -->
                    <div class="form-section">
                        <label for="observaciones" class="form-label">Observaciones</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="fas fa-sticky-note"></i></span>
                            <textarea class="form-control" id="observaciones" rows="4" placeholder="Observaciones sobre el jugador">Jugador en excelente forma física. Líder del equipo. Precisa seguimiento de su condición física debido a su edad.</textarea>
                        </div>
                    </div>

                    <!-- Botones de acción -->
                    <div class="d-flex justify-content-between mt-4">
                        <a href="#" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Volver
                        </a>
                        <button type="submit" class="btn-guardar">
                            <i class="fas fa-save me-2"></i>Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-logo">TorNet</p>
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Manejo del formulario
        document.getElementById('playerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Recoger datos del formulario
            const formData = {
                nombreJugador: document.getElementById('nombreJugador').value,
                posicion: document.getElementById('posicion').value,
                numeroCamiseta: document.getElementById('numeroCamiseta').value,
                edad: document.getElementById('edad').value,
                estado: document.getElementById('estado').value,
                observaciones: document.getElementById('observaciones').value
            };
            
            // Simular envío de datos
            console.log('Datos del jugador a guardar:', formData);
            
            // Mostrar mensaje de éxito
            alert('Los datos del jugador se han guardado correctamente.');
            
            // Aquí normalmente enviaríamos los datos al servidor
            // fetch('/api/guardar-jugador', { method: 'POST', body: JSON.stringify(formData) })
        });
        
        // Validación en tiempo real
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach(input => {
            input.addEventListener('blur', function() {
                if (this.value.trim() === '') {
                    this.classList.add('is-invalid');
                } else {
                    this.classList.remove('is-invalid');
                    this.classList.add('is-valid');
                }
            });
        });
    </script>
</body>
</html>
