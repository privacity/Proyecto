<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Partido - TorNet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global.css">
</head>
<body>
    <!-- Header -->
    <header class="main-header">
        <div class="header-title">
            <i class="fas fa-futbol me-2"></i>TorNet
        </div>
        <div class="header-buttons">
            <a href="ResPublicos.html" class="nav-btn">
                <i class="fas fa-arrow-left me-2"></i> Volver
            </a>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-content">
        <div class="container">
            <div class="details-container">

                <!-- Título de la página -->
                <div class="page-title-section">
                    <h1 class="page-title">Detalles del partido</h1>
                </div>

                <!-- Lista de eventos del partido -->
                <div class="events-container">
                    <div class="events-list">
                        <!-- Evento 1 -->
                        <div class="event-item">
                            <input type="checkbox" id="event1" class="event-checkbox">
                            <label for="event1" class="event-label">
                                <span class="event-type amonestacion">AMONESTACION</span>
                                <span class="event-details">RODRIQUEE R. 80</span>
                            </label>
                        </div>

                        <!-- Evento 2 -->
                        <div class="event-item">
                            <input type="checkbox" id="event2" class="event-checkbox" checked>
                            <label for="event2" class="event-label">
                                <span class="event-type gol">GOL</span>
                                <span class="event-details">AVILES A.</span>
                            </label>
                        </div>

                        <!-- Evento 3 -->
                        <div class="event-item">
                            <input type="checkbox" id="event3" class="event-checkbox">
                            <label for="event3" class="event-label">
                                <span class="event-type gol">GOL</span>
                                <span class="event-details">SALAZAR E. 55</span>
                            </label>
                        </div>

                        <!-- Evento 4 -->
                        <div class="event-item">
                            <input type="checkbox" id="event4" class="event-checkbox">
                            <label for="event4" class="event-label">
                                <span class="event-type amonestacion">AMONESTACION</span>
                                <span class="event-details">NAVA L.</span>
                            </label>
                        </div>

                        <!-- Evento 5 -->
                        <div class="event-item">
                            <input type="checkbox" id="event5" class="event-checkbox">
                            <label for="event5" class="event-label">
                                <span class="event-type amonestacion">AMONESTACION</span>
                                <span class="event-details">ALVARADO C.</span>
                            </label>
                        </div>

                        <!-- Evento 6 -->
                        <div class="event-item">
                            <input type="checkbox" id="event6" class="event-checkbox">
                            <label for="event6" class="event-label">
                                <span class="event-type amonestacion">AMONESTACION</span>
                                <span class="event-details">RODRIQUEE R. 77</span>
                            </label>
                        </div>

                        <!-- Evento 7 -->
                        <div class="event-item">
                            <input type="checkbox" id="event7" class="event-checkbox" checked>
                            <label for="event7" class="event-label">
                                <span class="event-type gol">GOL</span>
                                <span class="event-details">AVILES A.</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Información adicional del partido -->
                <div class="match-info">
                    <div class="info-item">
                        <span class="info-label">Estado:</span>
                        <span class="info-value">Finalizado</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Resultado:</span>
                        <span class="info-value">2 - 1</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Árbitro:</span>
                        <span class="info-value">Carlos Rodríguez</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-title">TorNet</div>
        <div class="footer-icons">
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-instagram"></i>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="detalles.js"></script>
</body>
</html>
