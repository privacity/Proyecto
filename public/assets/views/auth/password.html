<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
    <!-- Header -->
    <header class="main-header">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="index.html">TorNet</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <a href="index.html" class="nav-btn btn-inicio">Inicio</a>
                        <a href="contacto.html" class="nav-btn btn-contacto">Contacto</a>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content - Centered -->
    <main class="main-content">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="centered-form-container">
                        <div class="login-card">
                            <div class="card-header">
                                <h1 class="h3 mb-0">Cambiar contraseña</h1>
                            </div>
                            <div class="card-body">
                                
                                <form id="passwordForm" class="needs-validation" novalidate>
                                    <div class="form-group">
                                        <label for="email" class="form-label">Correo electrónico</label>
                                        <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo" required>
                                        <div class="invalid-feedback">Por favor, ingresa un correo electrónico válido.</div>
                                    </div>

                                    <div class="form-group">
                                        <label for="password" class="form-label">Nueva contraseña</label>
                                        <input type="password" class="form-control" id="password" placeholder="Ingresa tu nueva contraseña" required>
                                        <div class="invalid-feedback">Por favor, ingresa tu nueva contraseña.</div>
                                    </div>

                                    <div class="form-group">
                                        <label for="confirmPassword" class="form-label">Confirma tu contraseña</label>
                                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirma tu nueva contraseña" required>
                                        <div class="invalid-feedback">Por favor, re-ingresa tu contraseña.</div>
                                    </div>
                                    <button type="submit" class="btn btn-login">Actualizar contraseña</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer - Centered -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <!-- Logo y Descripción -->
                <div class="footer-logo">
                    TorNet
                </div>
                <p class="footer-description">
                    La mejor plataforma para conectar con la web y la cancha.
                </p>
                
                <!-- Redes Sociales -->
                <div class="social-icons">
                    <a href="#"><i class="fab fa-facebook"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                </div>
                
                <!-- Información de Contacto -->
                <div class="contact-info">
                    <div><i class="fas fa-map-marker-alt me-2"></i>Puebla, México</div>
                    <div><i class="fas fa-phone me-2"></i> +1 234 567 890</div>
                    <div><i class="fas fa-envelope me-2"></i> info@tornet.com</div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {

        const form = document.getElementById('passwordForm');
        const successMessage = document.getElementById('successMessage');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');

        // Validar coincidencia de contraseñas en tiempo real
        confirmPassword.addEventListener('input', function () {
            if (password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity('Las contraseñas no coinciden');
            } else {
                confirmPassword.setCustomValidity('');
            }
        });

        // Validación al enviar
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            event.stopPropagation();

            // Validar contraseñas
            if (password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity('Las contraseñas no coinciden');
            } else {
                confirmPassword.setCustomValidity('');
            }

            if (form.checkValidity()) {

                // === CONFIRMACIÓN ===
                const confirmar = confirm("¿Seguro que deseas cambiar tu contraseña?");
                if (!confirmar) {
                    alert("El cambio de contraseña fue cancelado.");
                    return;
                }

                // === ALERTA DE ÉXITO ===
                alert("¡Tu contraseña se ha actualizado correctamente!");

                // Mostrar mensaje verde de éxito
                successMessage.style.display = 'block';
                form.reset();
                form.classList.remove('was-validated');

                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 5000);

            } else {
                form.classList.add('was-validated');
            }
        });

    });
    </script>

</body>
</html>
